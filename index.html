<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沖繩慢旅｜2027 春節</title><style>
:root{--ink:#243f3b;--green:#385c50;--paper:#f6f4ed;--line:#dedfd5;--muted:#7b8479;--pink:#eec5bb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 14px}button:hover{background:#e9ede3}a{color:var(--green)}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:3px}.tiny{font-size:11px;letter-spacing:2px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:32px 5%}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}h1{font-family:serif;font-size:52px;line-height:1.25;margin:10px 0}h2{font-size:25px;margin:0}p{margin:10px 0}.heroArt{height:205px;border-radius:90px 12px 12px 12px;background:#dfe8dc;position:relative;overflow:hidden}.sun{position:absolute;width:82px;height:82px;border-radius:50%;background:#eebda2;right:65px;top:23px}.sea{position:absolute;bottom:0;background:#8eafa4;width:120%;height:85px;transform:rotate(-8deg);left:-10%}.island{position:absolute;background:#4c7060;width:180px;height:45px;border-radius:70% 20%;bottom:55px;left:45px;transform:rotate(-14deg)}.artLabel{position:absolute;right:25px;bottom:15px;color:white;letter-spacing:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0;border:1px solid var(--line);border-radius:12px;background:#ffffff80}.stats div{padding:18px 24px;border-right:1px solid var(--line)}.stats b{display:block;font-size:19px}.muted{color:var(--muted);font-size:13px}.tabs,.dates{display:flex;gap:9px;overflow:auto;padding:5px 0 20px}.tabs button{border:0;background:transparent}.tabs button.active{background:var(--green);color:white}.dates button{min-width:130px;text-align:left;padding:13px 17px}.dates button.active{background:#e2eadf;border-color:var(--green)}.dates strong{display:block;font-size:19px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:26px}.panel{background:#fffefa;border:1px solid var(--line);padding:24px;border-radius:12px;margin-bottom:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{background:#f4e7d4;color:#8c683b;font-size:11px;border-radius:5px;padding:3px 8px;white-space:nowrap}.ok{background:#dfeadc;color:#416044}.entry{display:grid;grid-template-columns:65px 1fr;gap:15px;margin-top:20px}.time{font-size:15px;font-weight:700;padding-top:9px}.card{border-left:3px solid #b8c8b2;background:white;box-shadow:0 3px 15px #334c3b08;padding:16px;border-radius:0 10px 10px 0}.card h3{margin:0;font-size:17px}.note{font-size:13px;background:#f1f2e9;padding:8px 11px;border-radius:6px;margin-top:10px}.tools{display:flex;gap:7px;margin-top:10px}.tools button{font-size:12px;padding:3px 9px}.route{display:flex;flex-wrap:wrap;gap:8px;margin:17px 0}.route span{background:#e9eee5;padding:5px 10px;border-radius:5px;font-size:13px}iframe{border:0;border-radius:9px;width:100%;height:240px;background:#e8eee5}input,select,textarea{padding:9px;border:1px solid #cdd5cb;border-radius:6px;background:white;max-width:100%}label{display:block;font-size:13px;margin:12px 0}label input,label textarea,label select{display:block;width:100%;margin-top:4px}dialog{border:0;border-radius:15px;padding:26px;width:min(560px,95vw);max-height:90vh}dialog::backdrop{background:#18362f66}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.primary{background:var(--green);color:white}.full{width:100%}.check{padding:13px 0;border-bottom:1px solid var(--line)}.budget{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}footer{padding:25px 0;font-size:12px;color:var(--muted)}.hidden{display:none}@media(max-width:800px){main{padding:24px 5%}h1{font-size:37px}.hero{grid-template-columns:1fr}.heroArt{height:130px}.stats{grid-template-columns:1fr 1fr}.stats div{padding:12px}.layout{grid-template-columns:1fr}header{font-size:12px}.budget{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style><header><div class="brand">島日和 <span class="tiny">OKINAWA JOURNAL</span></div><span>2027 春節 · 家族慢旅</span></header><main><section class="hero"><div><div class="tiny">FEBRUARY 05 — 10, 2027</div><h1>把日子放慢，<br>一起去沖繩。</h1><p class="muted">8 位大人的春節旅行手帳，為每一次停留留點餘裕。</p></div><div class="heroArt" aria-label="沖繩海島插畫"><div class="sun"></div><div class="sea"></div><div class="island"></div><div class="artLabel">海と、桜と、家族。</div></div></section><div class="stats"><div><span class="muted">旅程</span><b>6 天 5 夜</b></div><div><span class="muted">同行</span><b>8 位成人</b></div><div><span class="muted">租車時間</span><b>2/5 12:00 → 2/9 18:00</b></div><div><span class="muted">旅行節奏</span><b>少步行・多休息</b></div></div><nav class="tabs" id="tabs"></nav><div id="content"></div><footer>修改會保存在此瀏覽器；不同裝置不會自動同步。可用「匯出／匯入」備份與交換行程。所有移動時間為可編輯的規劃估值，並非即時導航。</footer></main><dialog id="editor"><form id="form"><h2>編輯這一站</h2><div class="formgrid"><label>日期<select name="day"></select></label><label>景點／活動<input name="title" required></label><label>停留長度（分鐘）<input name="duration" type="number" min="0" required></label><label>前往此站車程（分鐘）<input name="travel" type="number" min="0" required></label><label>狀態<select name="status"><option>待確認</option><option>已確定</option></select></label><label>預估費用（日圓／全團）<input name="cost" type="number" min="0"></label></div><label>此站開始時間（選填，留白則自動接續）<input name="start" type="time"></label><label>地圖搜尋地點／地址（待選定可留白）<input name="place"></label><label>步行／階梯提醒<input name="access"></label><label>長輩體力／休息備註<textarea name="note"></textarea></label><div class="row"><button type="button" onclick="editor.close()">取消</button><button class="primary">儲存並重排行程</button></div></form></dialog><input id="importFile" class="hidden" type="file" accept="application/json"><script>
const initial={days:[['2027-02-05','抵達・恩納',720],['2027-02-06','北部・八重岳',720],['2027-02-07','移動・那霸',720],['2027-02-08','購物・南部',720],['2027-02-09','市區・還車',720],['2027-02-10','返程',540]],items:[],stayNorth:'恩納地區住宿（飯店名稱待確認）',stayNaha:'那霸住宿（飯店名稱待確認）',car:'Toyota Alphard／Vellfire，8 人座；車款、行李容量與訂單待確認',costs:{租車:0,住宿:0,油資與停車:0,其他:0}};
function add(d,title,duration,travel,access,note,status='待確認'){initial.items.push({id:crypto.randomUUID(),day:d,title,duration,travel,access,note,status,cost:0})}
add(0,'機場取車',60,0,'接駁車上下車需協助；取車點待確認','12:00 取車條件已知；訂單與車款待確認');add(0,'簡單午餐｜嘉手納驛之館候選',60,40,'停車至餐廳距離、電梯待確認','先用餐與如廁，若等候過久改超商簡餐');add(0,'超市採買',60,20,'優先有停車場與洗手間的商場','店家待確認；長輩可坐著休息');add(0,'恩納住宿入住與休息',90,30,'確認電梯與下客位置','預留休息，依當日體力縮短採買');add(0,'晚餐｜ぱいかじ 恩納店候選',90,15,'座椅、階梯與接送待確認','8 人座位、菜單、春節營業與預約待確認');
add(1,'八重岳賞櫻',90,75,'山路、坡度與停車點待確認；減少步行','花況與交通管制待確認；以近停車處短程賞花為原則');add(1,'北部午餐／道之驛休息',60,30,'選擇有座位及洗手間的地點','餐廳待確認，避免排隊過久');add(1,'彈性休息／返回住宿',120,75,'以車程與休息為主','疲累就直接回飯店；古宇利島僅為替換候選');add(1,'晚餐',90,15,'確認無階梯或有電梯','餐廳待確認');
add(2,'12:00 退房',30,0,'協助行李與上下車','退房時間已知，後續移動順序待確認','已確定');add(2,'讀谷／美國村｜擇一',60,40,'優先近停車場區域；避免長距離繞行','尚未選定；可替換為嘉手納與買麵包，或直接到那霸');add(2,'那霸住宿入住與休息',120,50,'確認電梯與下客位置','飯店與入住時間待確認');add(2,'晚餐｜披薩／大阪燒候選',90,15,'8 人相鄰座位、階梯與停車待確認','候選：PORTO del mare Uojima、なお家；未預約');
add(3,'Outlet 購物',180,35,'分段逛街，每段預留坐下休息','可依體力提早返回；午餐於商場內候選');add(3,'晚餐與返回住宿',100,30,'優先有座椅且容易停車的餐廳','餐廳待確認');
add(4,'PARCO CITY',150,25,'確認電梯、休息座位與洗手間','長輩可分組休息；餐廳待確認');add(4,'新都心／DFS',120,25,'分段移動，避免連續逛街過久','可刪去其中一站，預留還車緩衝');add(4,'還車前準備／加油',45,30,'同行者與行李可先安排下客','還車店與接駁待確認；預留塞車時間');add(4,'18:00 前完成還車',15,15,'返回飯店交通待確認','固定期限 18:00；時間超出會顯示提醒','已確定');add(4,'晚餐／返回住宿',90,30,'還車後改搭計程車或其他交通','餐廳與交通待確認');
add(5,'退房與前往機場',60,0,'行李搬運與上下車需協助','班機、出發時間與交通待確認；目前 09:00 僅為排程起點');add(5,'機場報到與返程',150,30,'預留移動與報到時間','請依實際班機調整，尚未確定起飛時間');
let data;try{data=JSON.parse(localStorage.getItem('okinawa27'))||structuredClone(initial)}catch{data=structuredClone(initial)}let day=0,tab=0,editing=null;const tabs=['每日行程','住宿與租車','預算管理','備份與說明'];function save(){try{localStorage.setItem('okinawa27',JSON.stringify(data))}catch{alert('儲存失敗，請匯出備份')}render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tm(n){return (n>=1440?'次日 ':'')+String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function list(){return data.items.filter(x=>x.day===day)}function place(x){return x.place||({'八重岳賞櫻':'沖縄 八重岳','PARCO CITY':'沖縄 PARCO CITY','新都心／DFS':'沖縄 DFS 那覇','簡單午餐｜嘉手納驛之館候選':'沖縄 嘉手納 道の駅','晚餐｜ぱいかじ 恩納店候選':'沖縄 ぱいかじ 恩納店'}[x.title])||''}function maps(){let a=list().map(place).filter(Boolean);if(a.length<2)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a[0]||'沖縄');return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent('沖縄 '+a[0])+'&destination='+encodeURIComponent('沖縄 '+a.at(-1))+'&waypoints='+encodeURIComponent(a.slice(1,-1).map(x=>'沖縄 '+x).join('|'))+'&travelmode=driving'}
function render(){document.getElementById('tabs').innerHTML=tabs.map((x,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${x}</button>`).join('');let c=document.getElementById('content');if(tab===0){let t=Number(data.days[day][2]);let cards=list().map((x,i)=>{t+=Number(x.travel);if(x.start)t=x.start.split(':').reduce((a,b,i)=>a+Number(b)*(i?1:60),0);let start=t;t+=Number(x.duration);return `<div class="entry"><div class="time">${tm(start)}<div class="muted">${tm(t)}</div></div><div class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="tag ${x.status==='已確定'?'ok':''}">${esc(x.status)}</span></div><div class="muted">停留 ${x.duration} 分鐘 · 前段移動 ${x.travel} 分鐘（估）</div><div class="note">♿ ${esc(x.access)}</div><p class="muted">${esc(x.note)}</p>${day===4&&x.title.includes('完成還車')&&t>1080?'<p style="color:#b54b39">⚠ 排程超出 18:00 還車期限，請縮短前面行程。</p>':''}<div class="tools"><button onclick="edit('${x.id}')">編輯</button><button aria-label="上移" onclick="move('${x.id}',-1)">↑</button><button aria-label="下移" onclick="move('${x.id}',1)">↓</button><button onclick="removeItem('${x.id}')">刪除</button><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place(x)||'沖縄')}" target="_blank" rel="noopener">地圖 ↗</a></div></div></div>`}).join('');c.innerHTML=`<div class="dates">${data.days.map((d,i)=>`<button class="${day===i?'active':''}" onclick="day=${i};render()"><span class="tiny">DAY 0${i+1}</span><strong>${esc(d[0].slice(5).replace('-',' / '))}</strong><span class="muted">${esc(d[1])}</span></button>`).join('')}</div><div class="layout"><section><div class="row"><div><span class="tiny">YOUR DAILY PLAN</span><h2>${esc(data.days[day][1])}</h2></div><button onclick="edit(null)">＋ 新增一站</button></div><div class="row"><label>日期 <input type="date" value="${esc(data.days[day][0])}" onchange="data.days[day][0]=this.value;save()"></label><label>今日起點 <input type="time" value="${tm(Number(data.days[day][2]))}" onchange="data.days[day][2]=this.value.split(':').reduce((a,b,i)=>a+Number(b)*(i?1:60),0);save()"></label></div><p class="muted">修改起點、車程或停留時間，後續站點自動更新；選填的指定開始時間會固定，請留意衝突。</p>${cards||'<p>今天尚無行程，新增一站開始安排。</p>'}</section><aside><div class="panel"><div class="tiny">ROUTE OVERVIEW</div><h2>今天怎麼走</h2><div class="route">${list().map((x,i)=>`<span>${i+1} · ${esc(x.title.split('｜')[0])}</span>`).join(' → ')}</div><iframe title="當日區域地圖" loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(day<2?'沖縄 '+(day===1?'八重岳':'恩納村'):'沖縄 那覇')}&output=embed"></iframe><p class="muted">區域地圖供定位；導航僅包含已填地點的站點，未定住宿、餐廳與站點不納入。地址與車程待確認。</p><a href="${maps()}" target="_blank" rel="noopener">Google 地圖：已填地點的移動順序 ↗</a></div><div class="panel"><div class="tiny">SLOW TRAVEL</div><h2>把體力留給喜歡的事</h2><p>長輩使用助行車。每站先確認下客點、座位、洗手間與電梯。</p><div class="note">建議每 45–60 分鐘安排坐下休息；不舒服時可直接回飯店。</div></div><div class="panel"><h3>可替換／休息候選</h3><select class="full" id="alternative"><option>直接回飯店休息</option><option>超市／商場內休息</option><option>嘉手納驛之館</option><option>讀谷短暫停留</option><option>美國村短暫停留</option><option>古宇利島（車程與體力待評估）</option><option>琉貿百貨用餐</option></select><p class="muted">新增為「待確認」，可再上移到希望的位置。</p><button class="full" onclick="addAlternative()">加入今日候選</button></div></aside></div>`}else if(tab===1){c.innerHTML=`<div class="layout"><div class="panel"><h2>住得舒服，移動輕鬆</h2><label>2/5–2/7 北部住宿<input value="${esc(data.stayNorth)}" onchange="data.stayNorth=this.value;save()"></label><label>2/7–2/10 那霸住宿<input value="${esc(data.stayNaha)}" onchange="data.stayNaha=this.value;save()"></label><label>租車與訂單備註<textarea onchange="data.car=this.value;save()">${esc(data.car)}</textarea></label><p>租車條件：2027/2/5 12:00–2/9 18:00</p><p class="tag">飯店名稱、房型、入住時間與車款均待確認</p></div><div class="panel"><h2>預訂前確認</h2><p class="check">8 位成人＋行李＋助行車的實際裝載空間</p><p class="check">長輩上下車高度、扶手與下客動線</p><p class="check">飯店電梯、停車場及無階梯入口</p><p class="check">還車店、加油要求、機場接駁與春節營業</p><p class="muted">此處是待辦提醒，尚未代表設施已確認。</p></div></div>`}else if(tab===2){let sum=data.items.reduce((a,x)=>a+Number(x.cost||0),0)+Object.values(data.costs).reduce((a,b)=>a+Number(b||0),0);c.innerHTML=`<div class="panel"><span class="tiny">TRIP BUDGET · JPY</span><h2>旅行的花費，一起記下來</h2><div class="stats"><div>全團預估<b>¥ ${sum.toLocaleString()}</b></div><div>每人平均（8 人）<b>¥ ${Math.round(sum/8).toLocaleString()}</b></div></div><p class="muted">全部以日圓、全團金額填寫。0 代表尚未填寫，不代表免費；避免同一費用重複填入。</p><div class="budget">${Object.entries(data.costs).map(([k,v])=>`<label>${esc(k)}<input type="number" min="0" value="${v}" onchange="data.costs['${k}']=Number(this.value);save()"></label>`).join('')}</div><h3>各站餐飲／活動費用</h3>${data.items.map(x=>`<div class="row check"><span>${esc(data.days[x.day][0])} · ${esc(x.title)}</span><input aria-label="${esc(x.title)}費用" type="number" min="0" value="${x.cost||0}" onchange="data.items.find(i=>i.id==='${x.id}').cost=Number(this.value);save()"></div>`).join('')}</div>`}else{c.innerHTML=`<div class="panel"><h2>自己的行程，隨時調整</h2><p>① 選日期 → ② 編輯站點或停留長度 → ③ 後面行程自動重排。</p><p>上、下箭頭調整景點順序；編輯內的日期選單可以把景點移到另一天。</p><p>資料保存在目前瀏覽器，跨裝置請匯出後匯入。網站目前沒有多人即時共編。</p><div class="tools"><button onclick="exportData()">匯出 JSON 備份</button><button onclick="document.getElementById('importFile').click()">匯入備份</button><button onclick="if(confirm('將清除目前修改，恢復初始行程？')){data=structuredClone(initial);save()}">恢復初始行程</button></div><h3>安排狀態</h3><p>已知旅行條件與固定時間已保留；餐廳、路線、花況、無障礙設施與營業時間仍須確認。每日時間是可調整的草案，並非預約紀錄。</p></div>`}}
function edit(id){editing=id;let x=data.items.find(i=>i.id===id)||{day,title:'',duration:60,travel:15,status:'待確認',access:'步行距離、階梯與電梯待確認',note:'',cost:0};form.elements.day.innerHTML=data.days.map((d,i)=>`<option value="${i}">${esc(d[0])}</option>`).join('');for(let k of ['day','title','duration','travel','status','access','note','cost','start','place'])form.elements[k].value=x[k]??'';editor.showModal()}form.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));for(let k of ['day','duration','travel','cost'])x[k]=Number(x[k]);x.id=editing||crypto.randomUUID();if(editing)data.items[data.items.findIndex(i=>i.id===editing)]=x;else data.items.push(x);editor.close();save()};function move(id,n){let a=list(),i=a.findIndex(x=>x.id===id);if(!a[i+n])return;let p=data.items.indexOf(a[i]),q=data.items.indexOf(a[i+n]);[data.items[p],data.items[q]]=[data.items[q],data.items[p]];save()}function removeItem(id){if(confirm('刪除此站？')){data.items=data.items.filter(x=>x.id!==id);save()}}function addAlternative(){data.items.push({id:crypto.randomUUID(),day,title:document.getElementById('alternative').value,duration:60,travel:20,status:'待確認',access:'步行、階梯、座位與停車待確認',note:'替換候選，加入後請調整順序與時間',cost:0});save()}function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='okinawa-2027.json';a.click();URL.revokeObjectURL(u)}document.getElementById('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.days)||x.days.length!==6||!x.days.every(d=>Array.isArray(d)&&/^\d{4}-\d{2}-\d{2}$/.test(d[0])&&Number.isFinite(Number(d[2])))||!Array.isArray(x.items)||!x.items.every(i=>Number.isInteger(i.day)&&i.day>=0&&i.day<6&&typeof i.title==='string'&&Number.isFinite(Number(i.duration))&&i.duration>=0&&Number.isFinite(Number(i.travel))&&i.travel>=0)||!x.costs)throw Error();if(confirm('以備份取代目前行程？')){data=x;save()}}catch{alert('無法匯入，請選擇此網站匯出的有效 JSON 備份')}e.target.value=''};render();
</script></html>
